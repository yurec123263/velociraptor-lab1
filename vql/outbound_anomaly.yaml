name: Custom.Detection.OutboundAnomaly
description: Flags outobund connections to uncommon ports.
sources:
  - query: |
      SELECT Pid, {Select Name FROM processes WHERE Pid = ProcPid} as ProcessesName
      Laddr.IP AS LocalIP,
      Laddr.Port AS LocalPort,
      Raddr.IP AS RemoteIP,
      Raddr.Port AS RemotePort,
      Satus
      FROM nestat()
      WHERE TypeString = "TCP"
      AND Status = "ESTAB"
      AND Raddr.IP = "192.168.56.10"
      AND Raddr.Port != 8000
